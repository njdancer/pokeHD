<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Home-screen app (p1-kidproof): full screen, no zooming, nothing a small thumb can scroll away. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="pokeHD" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="robots" content="noindex, nofollow" />
    <title>pokeHD</title>
    <!-- The loading screen (LoadingScreen.tsx), styled here so it's up before any script runs. -->
    <style>
      .boot {
        position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(#a9d6ee, #dff0f2 46%, #d9ebb8 62%, #9fcb72);
        color: #3e2a1c; font: 800 clamp(17px, 4.6vw, 22px) / 1.3 Nunito, ui-rounded, system-ui, sans-serif;
        transition: opacity .45s ease; -webkit-user-select: none; user-select: none;
      }
      .boot[data-leaving] { opacity: 0; pointer-events: none; }
      .boot-ball {
        --s: clamp(48px, 14vw, 72px);
        width: var(--s); aspect-ratio: 1; border-radius: 50%;
        background:
          radial-gradient(circle at 32% 26%, #fffc 0 9%, transparent 11%),
          radial-gradient(circle, #fff 0 16%, #2b2b33 17% 29%, transparent 30%),
          linear-gradient(#e8473b 0 44%, #2b2b33 44% 56%, #fbfbfb 56%);
        box-shadow: 0 0 0 calc(var(--s) * .06) #2b2b33;
        animation: boot-hop 1s cubic-bezier(.33, 0, .67, 1) infinite alternate;
      }
      .boot-shadow {
        width: clamp(40px, 11vw, 60px); height: 10px; margin-top: 10px; border-radius: 50%; background: #3e5a2a55;
        animation: boot-shadow 1s cubic-bezier(.33, 0, .67, 1) infinite alternate;
      }
      .boot-words { margin: 22px 0 0; padding: 0 16px; text-align: center; animation: boot-pulse 2s ease-in-out infinite; }
      @keyframes boot-hop { from { translate: 0 0; rotate: -8deg; } to { translate: 0 -34px; rotate: 8deg; } }
      @keyframes boot-shadow { to { scale: .6; opacity: .5; } }
      @keyframes boot-pulse { 50% { opacity: .6; } }
      @media (prefers-reduced-motion: reduce) { .boot-ball, .boot-shadow, .boot-words { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading"><div class="boot-ball"></div><div class="boot-shadow"></div><p class="boot-words">Getting your world ready…</p></div>
    </div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
