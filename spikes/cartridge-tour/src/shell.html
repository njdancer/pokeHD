<title>Cartridge to Screen 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one screen. HUD strip on top, the 3D board in the middle, the dialog and controls at the
   bottom. The board's canvas never sits under the dialog. Single dark look: a circuit board at night. */
:root {
  color-scheme: dark;
  --board: #0d1511;
  --panel: #141f19;
  --panel-2: #1b2a22;
  --line: #2a3d32;
  --ink: #e7efe4;
  --dim: #93a69a;
  --rom: #e3a85c;
  --wram: #5ec7b8;
  --vram: #ad92f2;
  --oam: #f2809e;
  --io: #b9dc4c;
  --accent: #f4c650;
  --good: #7fdc8a;
  --bad: #ff8a7a;
  --f-display: "Silkscreen", "Courier New", monospace;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; }
body { margin: 0; background: var(--board); color: var(--ink); font-family: var(--f-body); font-size: 15px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
#app { height: 100%; display: flex; flex-direction: column; }

/* HUD */
#hud { flex: none; padding: 8px 16px 6px; background: linear-gradient(var(--panel), var(--board)); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
#hud .row { display: flex; align-items: center; gap: 10px; min-width: 0; }
#lvl { font-family: var(--f-display); font-size: 13px; letter-spacing: .04em; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
#beatno { font-family: var(--f-mono); font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hbtn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.hbtn:focus-visible, .cbtn:focus-visible, .lcard:focus-visible, .dpad button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hbtn[aria-pressed="true"] { background: var(--io); color: #10200f; border-color: var(--io); }
.hbtn:disabled { opacity: .45; cursor: default; }
#regs { font-family: var(--f-mono); font-size: 11.5px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 2px 12px; font-variant-numeric: tabular-nums; }
#regs b { color: var(--ink); font-weight: 600; }
#regs .bank b { color: var(--rom); }
#regs .fn b { color: var(--accent); }
#regs .chg b { color: var(--io); }

/* board */
#stage { flex: 1; position: relative; min-height: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#legend { position: absolute; left: 10px; top: 8px; display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--dim); pointer-events: none; }
#legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; background: var(--c); }
#toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--accent); color: var(--ink); padding: 6px 12px; border-radius: 8px; font-size: 13px; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); color: var(--dim); }

/* dialog */
#dialog { flex: none; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
#caption { font-size: 16px; line-height: 1.4; min-height: 2.8em; text-wrap: pretty; }
#caption em { font-style: normal; color: var(--accent); }
#caption code, #details code, #sheet code { font-family: var(--f-mono); font-size: .9em; color: var(--io); }
#details { font-size: 13px; line-height: 1.5; color: var(--dim); max-height: 28vh; overflow: auto; border-left: 2px solid var(--line); padding-left: 10px; }
#details pre { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink); background: var(--board); padding: 8px; border-radius: 6px; overflow-x: auto; margin: 6px 0 0; }
#controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cbtn { white-space: nowrap; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; min-width: 40px; height: 38px; padding: 0 10px; cursor: pointer; font-size: 15px; }
.cbtn.primary { background: var(--accent); color: #231a02; border-color: var(--accent); font-weight: 700; flex: 1; max-width: 220px; }
#scrub { flex: 1; min-width: 80px; accent-color: var(--accent); }
#speed { font-family: var(--f-mono); }
.dpad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 38px); gap: 4px; }
.dpad button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 16px; }
.dpad .up { grid-column: 2; grid-row: 1; }
.dpad .left { grid-column: 1; grid-row: 2; }
.dpad .down { grid-column: 2; grid-row: 2; }
.dpad .right { grid-column: 3; grid-row: 2; }

/* inspect sheet */
#sheet { flex: none; background: var(--panel-2); border-top: 2px solid var(--accent); padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); max-height: 46vh; overflow: auto; font-size: 13.5px; line-height: 1.45; }
#sheet h3 { margin: 0 0 4px; font-family: var(--f-mono); font-size: 15px; color: var(--accent); font-weight: 600; }
#sheet ol { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
#sheet li::marker { color: var(--dim); }
#sheet .src { color: var(--rom); }
#sheet .ram { color: var(--wram); }
#sheet .vram { color: var(--vram); }
#sheet .why { color: var(--dim); font-size: 12.5px; }
#sheet .head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }

/* level select */
#levels { position: fixed; inset: 0; background: var(--board); z-index: 10; overflow: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
#levels .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
#levels h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 7vw, 40px); margin: 6px 0 0; color: var(--ink); letter-spacing: .02em; text-wrap: balance; }
#levels h1 span { color: var(--io); }
#levels p { margin: 0; color: var(--dim); max-width: 60ch; line-height: 1.5; }
#levelgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.lcard { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lcard .n { font-family: var(--f-display); font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; }
.lcard .t { font-weight: 700; font-size: 16px; }
.lcard .s { color: var(--dim); font-size: 13px; line-height: 1.35; }
.lcard .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.lcard .bar i { display: block; height: 100%; background: var(--io); }
.lcard.locked { opacity: .5; }
.lcard.done .n b { color: var(--good); }
.cbtn.primary.ready { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 35%, transparent); } }
.dimaddr { font-family: var(--f-mono); font-size: .85em; color: var(--dim); }
#caption .dimaddr { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (min-width: 900px) {
  #caption { font-size: 17px; }
  #dialog { padding-inline: 24px; }
}
</style>

<div id="app">
  <header id="hud">
    <div class="row">
      <button class="hbtn" id="menu" aria-label="Levels">☰ Levels</button>
      <div id="lvl">Cartridge to Screen</div>
      <span id="beatno"></span>
      <button class="hbtn" id="goggles" aria-pressed="false" disabled title="Unlocked after level 8">Pixel goggles</button>
    </div>
    <div id="regs"></div>
  </header>
  <main id="stage">
    <canvas id="gl"></canvas>
    <div id="legend"><span style="--c:var(--rom)">ROM</span><span style="--c:var(--wram)">Work RAM</span><span style="--c:var(--vram)">Video RAM</span><span style="--c:var(--oam)">OAM</span><span style="--c:var(--io)">Registers</span></div>
    <div id="toast" hidden></div>
    <div id="loading">Loading the cartridge…</div>
  </main>
  <section id="dialog">
    <div id="caption"></div>
    <div id="details" hidden></div>
    <div id="controls">
      <button class="cbtn" id="prev" aria-label="Previous beat">◀</button>
      <button class="cbtn" id="replay" aria-label="Replay this beat">↻</button>
      <button class="cbtn primary" id="next">Next ▶</button>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Scrub through this beat">
      <button class="cbtn" id="speed" aria-label="Speed">1×</button>
      <button class="cbtn" id="more" aria-expanded="false">Details</button>
      <div class="dpad" id="dpad" hidden>
        <button class="up" data-d="up" aria-label="Up">▲</button>
        <button class="left" data-d="left" aria-label="Left">◀</button>
        <button class="down" data-d="down" aria-label="Down">▼</button>
        <button class="right" data-d="right" aria-label="Right">▶</button>
      </div>
    </div>
  </section>
  <section id="sheet" hidden></section>
</div>
<div id="levels" hidden>
  <div class="wrap">
    <h1>Cartridge <span>to</span> Screen</h1>
    <p>Follow Pokémon Blue as it gets Pallet Town from the cartridge onto the Game Boy's screen, one byte at a time. Every cube is a byte. Tap any cube to see where it came from.</p>
    <div id="levelgrid"></div>
  </div>
</div>
